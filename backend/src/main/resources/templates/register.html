<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New user · User Management Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-3xl mx-auto px-6 py-10">

    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-indigo-400">Administration</p>
            <h1 class="mt-2 text-2xl font-bold text-white">Create a user</h1>
        </div>
        <a th:href="@{/users}" class="text-sm font-semibold text-slate-400 hover:text-white transition">← Back to users</a>
    </div>

    <div th:if="${formError}" class="mt-6 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300" th:text="${formError}"></div>

    <form th:action="@{/users/save}" th:object="${user}" method="post"
          class="mt-8 space-y-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-2xl shadow-black/30">

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="username" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-400">Username</label>
                <input id="username" type="text" th:field="*{username}" placeholder="jane.doe" autocomplete="off"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-xs text-rose-400"></p>
            </div>
            <div>
                <label for="email" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-400">Email</label>
                <input id="email" type="email" th:field="*{email}" placeholder="jane@example.com" autocomplete="off"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-rose-400"></p>
            </div>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="password" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-400">Temporary password</label>
                <input id="password" type="password" th:field="*{password}" placeholder="At least 8 characters" autocomplete="new-password"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-rose-400"></p>
                <p class="mt-1 text-xs text-slate-500">Hashed with BCrypt before it reaches the database.</p>
            </div>
            <div>
                <label for="rankId" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-400">Rank</label>
                <select id="rankId" name="rankId"
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option th:each="rank : ${allRanks}" th:value="${rank.id}"
                            th:selected="${rank.name == 'USER'}"
                            th:text="${rank.name + ' · level ' + rank.level}">USER · level 10</option>
                </select>
            </div>
        </div>

        <div>
            <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Spring Security roles</p>
            <div class="grid gap-3 sm:grid-cols-2">
                <label th:each="role : ${allRoles}"
                       class="flex cursor-pointer items-center gap-3 rounded-lg border border-slate-800 bg-slate-950/60 px-4 py-3 hover:border-indigo-500/40 transition">
                    <input type="checkbox" name="roles" th:value="${role.name}"
                           th:checked="${role.name.name() == 'ROLE_USER'}"
                           class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-indigo-500 focus:ring-indigo-500">
                    <span class="text-sm font-medium text-slate-200" th:text="${#strings.replace(role.name.name(), 'ROLE_', '')}">USER</span>
                </label>
            </div>
            <p class="mt-2 text-xs text-slate-500">An administrator cannot assign a rank at or above their own.</p>
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-5">
            <a th:href="@{/users}" class="rounded-lg border border-slate-700 px-4 py-2.5 text-sm font-semibold text-slate-300 hover:border-slate-500 hover:text-white transition">Cancel</a>
            <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-950/40 hover:bg-indigo-500 transition">
                Create user
            </button>
        </div>
    </form>
</div>
</body>
</html>
