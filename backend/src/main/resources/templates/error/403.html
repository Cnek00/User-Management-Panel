<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access denied · User Management Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 text-slate-100">
<div class="text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-rose-400">403</p>
    <h1 class="mt-3 text-3xl font-extrabold">Access denied</h1>
    <p class="mt-2 text-sm text-slate-400">Your role or rank does not allow this action.</p>
    <a th:href="@{/users}" class="mt-6 inline-block rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">Back to users</a>
</div>
</body>
</html>
